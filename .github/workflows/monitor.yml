name: Monitor Supersalud y Supersubsidio

on:
  workflow_dispatch:     # Permite correr la automatización desde GitHub

  schedule:
    - cron: "0 * * * *"   #Hace que corra en el minuto 0 de cada hora 

permissions:
  contents: write         #le da permiso de modificar el repo

jobs:
  ejecutar-monitor:
    runs-on: ubuntu-latest #Genera una maquina nueva para ejecutar el programa

    steps:
      - name: Descargar repositorio #descarga el proyecto 
        uses: actions/checkout@v4

      - name: Configurar Python    #treae a python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias #Basicamente genera el entorno en la maquina para que se pueda correr el trabajo en ese entorno vitual
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar monitor #Vamos a definir las variables de entorno
        env:
          SMTP_SERVIDOR: ${{ secrets.SMTP_SERVIDOR }}
          SMTP_PUERTO: ${{ secrets.SMTP_PUERTO }}
          CORREO_USUARIO: ${{ secrets.CORREO_USUARIO }}
          CORREO_CONTRASENA: ${{ secrets.CORREO_CONTRASENA }}
          CORREO_DESTINATARIO: ${{ secrets.CORREO_DESTINATARIO }}
        run: python monitor.py

      - name: Guardar estado actualizado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add estado.json

          if git diff --cached --quiet; then  
            echo "No hubo cambios en estado.json"
          else
            git commit -m "Actualiza estado del monitor"
            git push
          fi